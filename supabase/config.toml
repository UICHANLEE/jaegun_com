project_id = "jaegun-community"

[db]
major_version = 15

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = [
  "http://127.0.0.1:4173",
  "http://localhost:4173",
  "http://127.0.0.1:4173/reset-password",
  "http://localhost:4173/reset-password",
  "http://localhost:5173/reset-password",
  "https://jaegun-com.vercel.app",
  "https://jaegun-com.vercel.app/reset-password",
  "https://jaegun-com.vercel.app/auth/callback/signup",
  "https://jaegun-com.vercel.app/auth/callback/signup?sb_flow_id=*",
  "https://jaegun-com.vercel.app/auth/callback/recovery",
  "https://jaegun-com.vercel.app/auth/callback/recovery?sb_flow_id=*"
]
jwt_expiry = 3600
enable_signup = true
enable_anonymous_sign_ins = false
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10

[auth.rate_limit]
sign_in_sign_ups = 30
token_refresh = 150
token_verifications = 30

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = true
max_frequency = "1m"
otp_length = 6
otp_expiry = 900

[auth.mfa]
max_enrolled_factors = 5

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[storage]
enabled = true
file_size_limit = "500MiB"

# Called only by the scheduler and authenticated inside the handler with the
# dedicated PUSH_WORKER_SECRET. User-facing functions keep the default gateway
# JWT verification enabled.
[functions.deliver-push]
verify_jwt = false

[functions.cleanup-media]
verify_jwt = false

# Called only by the scheduler and authenticated inside the handler with the
# dedicated ACCOUNT_DELETION_WORKER_SECRET. Browser origins are rejected.
[functions.process-account-deletions]
verify_jwt = false

# Called only by the scheduler. The handler validates the dedicated 32+
# character EVENT_REMINDER_SCHEDULER_SECRET before using the service-role RPC.
[functions.dispatch-event-reminders]
verify_jwt = false
