name: Web quality

on:
  pull_request:
    paths:
      - "apps/web/**"
      - "supabase/**"
      - "vercel.json"
      - ".github/workflows/web-quality.yml"
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "supabase/**"
      - "vercel.json"
      - ".github/workflows/web-quality.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
