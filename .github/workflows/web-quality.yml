name: Web quality

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "package.json"
      - "package-lock.json"
      - "apps/web/**"
      - "supabase/**"
      - "scripts/**"
      - "docs/**"
      - "vercel.json"
      - ".github/**"
  push:
    branches: [main]
    paths:
      - "package.json"
      - "package-lock.json"
      - "apps/web/**"
      - "supabase/**"
      - "scripts/**"
      - "docs/**"
      - "vercel.json"
      - ".github/**"

concurrency:
  group: web-quality-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  static-security:
    name: Secrets and migration safety
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.2.7
      - run: node scripts/security/scan-secrets.mjs
      - run: node --experimental-strip-types scripts/security/verify-legal-document-hashes.mjs
      - run: node scripts/security/lint-sql-migrations.mjs
      - run: node --test supabase/functions/request-account-deletion/security.test.mjs supabase/functions/push-security.test.mjs supabase/functions/cleanup-media/security.test.mjs supabase/functions/process-account-deletions/security.test.mjs supabase/functions/dispatch-event-reminders/security.test.mjs
      - run: deno check --config supabase/functions/request-account-deletion/deno.json supabase/functions/request-account-deletion/index.ts supabase/functions/register-push-device/index.ts supabase/functions/deliver-push/index.ts supabase/functions/cleanup-media/index.ts supabase/functions/process-account-deletions/index.ts supabase/functions/dispatch-event-reminders/index.ts

  dependency-audit:
    name: Dependency audit (high and critical)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/web/package-lock.json
      - run: npm audit --package-lock-only --audit-level=high
      - run: npm --prefix apps/web audit --package-lock-only --audit-level=high

  web:
    name: Web typecheck, tests, and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  database:
    name: Supabase migrations and pgTAP
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_CLI_VERSION: 2.115.0
      SUPABASE_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Start isolated local Supabase
        run: npx --yes supabase@${SUPABASE_CLI_VERSION} start
      - name: Rebuild from migrations and seed
        run: npx --yes supabase@${SUPABASE_CLI_VERSION} db reset --local
      - name: Run pgTAP regression suite
        run: npx --yes supabase@${SUPABASE_CLI_VERSION} test db --local
      - name: Stop local Supabase
        if: always()
        continue-on-error: true
        run: npx --yes supabase@${SUPABASE_CLI_VERSION} stop --no-backup
